<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>FIFA World Cat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{overflow:hidden;touch-action:none;}
body{overflow:hidden;touch-action:none;width:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
#game{position:fixed;top:0;left:0;right:0;overflow:hidden;}

#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none;z-index:0;}
#overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.4));z-index:1;pointer-events:none;}

#topBar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 12px 14px;
  background:rgba(5,15,40,0.55);
  backdrop-filter:blur(28px) saturate(2);
  -webkit-backdrop-filter:blur(28px) saturate(2);
  border-bottom:1px solid rgba(60,140,255,0.25);
}
#topInner{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:nowrap;}
#topLabel{font-size:8px;font-weight:800;letter-spacing:2.5px;color:rgba(100,180,255,0.55);text-transform:uppercase;white-space:nowrap;margin-right:4px;}
.seg{display:flex;flex-direction:column;align-items:center;background:rgba(20,70,200,0.22);border:1px solid rgba(60,140,255,0.28);border-radius:10px;padding:5px 8px 4px;min-width:38px;}
.seg-val{font-size:20px;font-weight:800;color:#7ec8ff;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 20px rgba(60,140,255,0.6),0 0 6px rgba(60,140,255,0.4);}
.seg-label{font-size:7px;font-weight:700;letter-spacing:1.5px;color:rgba(100,180,255,0.4);text-transform:uppercase;margin-top:3px;}
.sep{font-size:18px;font-weight:700;color:rgba(60,140,255,0.4);padding-bottom:10px;user-select:none;}
#livePill{display:none;align-items:center;gap:7px;background:rgba(255,50,50,0.18);border:1px solid rgba(255,80,80,0.4);border-radius:100px;padding:7px 18px;color:#ff6b6b;font-size:13px;font-weight:800;letter-spacing:2px;}
#liveDot{width:7px;height:7px;border-radius:50%;background:#ff4444;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(0.6);}}

#mascots{position:absolute;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.mascot{width:380px;height:auto;object-fit:contain;cursor:pointer;pointer-events:auto;transition:transform .18s ease;filter:drop-shadow(0 16px 24px rgba(0,0,0,.55));user-select:none;-webkit-user-drag:none;max-width:90vw;display:block;}
.mascot:active{transform:scale(1.07) translateY(-4px);}

#ballWrap{position:absolute;width:78px;height:78px;overflow:hidden;border-radius:50%;z-index:5;will-change:transform;cursor:grab;filter:drop-shadow(0 14px 14px rgba(0,0,0,.4));}
#ballWrap.dragging{cursor:grabbing;}
#ball{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none;}

#bottomBar{
  position:absolute;left:0;right:0;z-index:20;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(5,15,40,0.55);
  backdrop-filter:blur(28px) saturate(2);
  -webkit-backdrop-filter:blur(28px) saturate(2);
  border-top:1px solid rgba(60,140,255,0.22);
}
#socialRow{display:flex;align-items:stretch;justify-content:center;gap:8px;}

.social-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 4px;border-radius:100px;
  background:rgba(255,255,255,0.09);
  border:0.5px solid rgba(255,255,255,0.18);
  cursor:pointer;text-decoration:none;
  transition:background .18s,transform .12s;
  touch-action:manipulation;
  flex:1;min-width:0;
}
.social-btn:active{background:rgba(255,255,255,0.18);transform:scale(0.96);}
.social-btn img{width:17px;height:17px;object-fit:contain;border-radius:3px;flex-shrink:0;}
.social-btn span{font-size:12px;font-weight:600;color:rgba(255,255,255,0.88);white-space:nowrap;}

#dexBtn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:11px 4px;border-radius:100px;
  background:rgba(0,200,120,0.18);
  border:1px solid rgba(0,255,160,0.45);
  cursor:pointer;text-decoration:none;
  transition:background .18s,transform .12s;
  touch-action:manipulation;
  flex:1;min-width:0;
}
#dexBtn:active{background:rgba(0,255,160,0.28);transform:scale(0.97);}
#dexBtn .dex-dot{width:6px;height:6px;border-radius:50%;background:#00ffa0;flex-shrink:0;animation:blink 1.4s ease-in-out infinite;}
#dexBtn .dex-main{font-size:11px;font-weight:800;color:#00ffa0;letter-spacing:.3px;white-space:nowrap;}
</style>
</head>
<body>
<div id="game">
  <img id="bg" src="https://raw.githubusercontent.com/2026-labs/assets/refs/heads/main/bgwc.jpg">
  <div id="overlay"></div>

  <div id="topBar">
    <div id="topInner">
      <div id="topLabel">Live in</div>
      <div class="seg"><span class="seg-val" id="sDays">00</span><span class="seg-label">days</span></div>
      <div class="sep">:</div>
      <div class="seg"><span class="seg-val" id="sHours">00</span><span class="seg-label">hrs</span></div>
      <div class="sep">:</div>
      <div class="seg"><span class="seg-val" id="sMins">00</span><span class="seg-label">min</span></div>
      <div class="sep">:</div>
      <div class="seg"><span class="seg-val" id="sSecs">00</span><span class="seg-label">sec</span></div>
      <div id="livePill"><div id="liveDot"></div>LIVE</div>
    </div>
  </div>

  <div id="mascots">
    <img class="mascot" src="https://raw.githubusercontent.com/2026-labs/assets/refs/heads/main/wcatmascot.png">
  </div>

  <div id="ballWrap">
    <img id="ball" draggable="false" src="https://raw.githubusercontent.com/2026-labs/assets/refs/heads/main/ball.png">
  </div>

  <div id="bottomBar">
    <div id="socialRow">
      <a class="social-btn" href="https://t.me/fifaworldcat" target="_blank">
        <img src="https://raw.githubusercontent.com/2026-labs/assets/refs/heads/main/telegramicon.webp" alt="Telegram">
        <span>Telegram</span>
      </a>
      <a class="social-btn" href="https://x.com/FFWorldcat" target="_blank">
        <img src="https://raw.githubusercontent.com/2026-labs/assets/refs/heads/main/xicon.webp" alt="X">
        <span>Twitter / X</span>
      </a>
      <a id="dexBtn" href="https://dexscreener.com/solana/2M8Vhj8gqcaqpAw2PpoeHRSg8yct3NA1ErpuLH3r3WTF" target="_blank">
        <div class="dex-dot"></div>
        <span class="dex-main">$FIFAWORLDCAT</span>
      </a>
    </div>
  </div>
</div>

<script>
const game = document.getElementById("game");
const topBar = document.getElementById("topBar");
const bottomBar = document.getElementById("bottomBar");
const mascots = document.getElementById("mascots");
const ballWrap = document.getElementById("ballWrap");

function setLayout() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  game.style.width = W + "px";
  game.style.height = H + "px";

  const topH = topBar.offsetHeight;
  const botH = bottomBar.offsetHeight;

  bottomBar.style.bottom = "0";
  mascots.style.top = topH + "px";
  mascots.style.height = (H - topH - botH) + "px";

  CEIL = topH;
  FLOOR = H - botH;
}

const SIZE = 78;
let CEIL = 60, FLOOR = 500;
let x = window.innerWidth/2 - SIZE/2;
let y = window.innerHeight/2 - SIZE/2;
let vx = 0, vy = 0, rotation = 0, dragRotation = 0;
let dragging = false, startX = 0, startY = 0, lastX = 0, lastY = 0, moved = false;
const gravity = 0.25, bounce = 0.82, air = 0.998, floorFriction = 0.992;

function render(){ballWrap.style.transform=`translate3d(${x}px,${y}px,0) rotate(${rotation}deg)`;}
function getPoint(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
function kick(){vx+=(Math.random()-.5)*24;vy-=10+Math.random()*10;rotation+=(Math.random()-.5)*120;}
function startDrag(e){e.preventDefault();dragging=true;moved=false;ballWrap.classList.add("dragging");const p=getPoint(e);startX=p.x-x;startY=p.y-y;lastX=p.x;lastY=p.y;vx=0;vy=0;}
function moveDrag(e){e.preventDefault();if(!dragging)return;const p=getPoint(e);const dx=p.x-lastX,dy=p.y-lastY;if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;vx=dx*.9;vy=dy*.9;lastX=p.x;lastY=p.y;x=p.x-startX;y=p.y-startY;dragRotation+=vx*.4;rotation=dragRotation;}
function endDrag(){if(!dragging)return;dragging=false;ballWrap.classList.remove("dragging");if(!moved)kick();}

ballWrap.addEventListener("mousedown",startDrag);
window.addEventListener("mousemove",moveDrag);
window.addEventListener("mouseup",endDrag);
ballWrap.addEventListener("touchstart",startDrag,{passive:false});
window.addEventListener("touchmove",moveDrag,{passive:false});
window.addEventListener("touchend",endDrag);

document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});

function physics(){
  if(!dragging){
    vy+=gravity;vx*=air;vy*=air;x+=vx;y+=vy;
    if(x<=0){x=0;vx*=-bounce;}
    if(x+SIZE>=window.innerWidth){x=window.innerWidth-SIZE;vx*=-bounce;}
    if(y<=CEIL){y=CEIL;vy*=-bounce;}
    if(y+SIZE>=FLOOR){y=FLOOR-SIZE;vy*=-bounce;vx*=floorFriction;if(Math.abs(vy)<0.25)vy=0;}
    rotation+=vx*.7;
  }
  render();requestAnimationFrame(physics);
}

setLayout();
render();
physics();
window.addEventListener("resize", setLayout);

const targetDate = new Date("2026-06-11T19:00:00Z").getTime();
const sDays=document.getElementById("sDays"),sHours=document.getElementById("sHours"),sMins=document.getElementById("sMins"),sSecs=document.getElementById("sSecs");
const topLabel=document.getElementById("topLabel"),livePill=document.getElementById("livePill");
const allSegs=document.querySelectorAll(".seg"),allSeps=document.querySelectorAll(".sep");
function pad(n){return String(n).padStart(2,"0");}
function updateCountdown(){
  const diff=targetDate-Date.now();
  if(diff<=0){
    topLabel.style.display="none";
    allSegs.forEach(s=>s.style.display="none");
    allSeps.forEach(s=>s.style.display="none");
    livePill.style.display="flex";
    return;
  }
  sDays.textContent=pad(Math.floor(diff/(1000*60*60*24)));
  sHours.textContent=pad(Math.floor((diff/(1000*60*60))%24));
  sMins.textContent=pad(Math.floor((diff/(1000*60))%60));
  sSecs.textContent=pad(Math.floor((diff/1000)%60));
}
updateCountdown();setInterval(updateCountdown,1000);

document.querySelectorAll(".mascot").forEach(img=>{
  img.addEventListener("click",()=>{
    img.animate([{transform:"scale(1) translateY(0)"},{transform:"scale(1.08) translateY(-6px)"},{transform:"scale(1) translateY(0)"}],{duration:240,easing:"ease-out"});
  });
});
</script>
</body>
</html>
